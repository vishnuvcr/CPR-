name: CPR Phase 5B Frozen Candidate Validation

on:
  workflow_dispatch:
  push:
    branches:
      - cpr-v1.0-scientific-multi-dimensional-testing
    paths:
      - "scripts/run_phase5b_frozen_candidate_validation.py"
      - "scripts/run_cpr_regime_discovery.py"
      - "scripts/prepare_reference_nifty.py"
      - "cpr_lab/**"

jobs:
  phase5b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m pip install "scikit-learn>=1.5"

      - name: Download pinned reference source
        run: |
          mkdir -p data/phase5b
          curl -L --fail --retry 3 \
            "https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv" \
            -o data/phase5b/nifty50_candlestick_data.csv

      - name: Prepare fixed 5-minute reference data
        run: |
          python scripts/prepare_reference_nifty.py \
            --input data/phase5b/nifty50_candlestick_data.csv \
            --output data/phase5b/reference_nifty_5m.csv

      - name: Run Phase 5A discovery with frozen provenance
        run: |
          rm -rf artifacts/phase5a
          python scripts/run_cpr_regime_discovery.py \
            --input data/phase5b/reference_nifty_5m.csv \
            --output-dir artifacts/phase5a

      - name: Run Phase 5B frozen-candidate validation
        run: |
          rm -rf artifacts/phase5b
          python scripts/run_phase5b_frozen_candidate_validation.py \
            --intraday-events artifacts/phase5a/regime_discovery_intraday_events.csv \
            --swing-events artifacts/phase5a/regime_discovery_swing_events.csv \
            --frontier artifacts/phase5a/regime_discovery_train_pareto.csv \
            --output-dir artifacts/phase5b

      - name: Publish Phase 5B summary to GitHub Actions
        shell: bash
        run: |
          echo "## Phase 5B frozen-candidate validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import pandas as pd
          p="artifacts/phase5b/phase5b_summary.csv"
          df=pd.read_csv(p)
          print(f"Frozen candidates evaluated: {len(df)}")
          print("")
          print("| Candidate | Asset | Horizon | Side | Test signals | Test mean R | 95% CI | Sensitivity | Specificity | Youden J | Positive-year fraction |")
          print("|---:|---|---|---|---:|---:|---|---:|---:|---:|---:|")
          for _,r in df.iterrows():
              print(f"| {int(r.candidate_id)} | {r.asset} | {r.source_horizon} | {r.side} | {int(r.test_signals)} | {r.test_mean_R:.4f} | [{r.test_mean_ci95_low:.4f}, {r.test_mean_ci95_high:.4f}] | {r.test_sensitivity:.3f} | {r.test_specificity:.3f} | {r.test_youden_J:.3f} | {r.positive_year_fraction:.3f} |")
          PY

      - name: Upload Phase 5A and 5B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-phase5b-frozen-candidate-validation
          path: |
            artifacts/phase5a/*.csv
            artifacts/phase5a/tree_*.txt
            artifacts/phase5b/*.csv
