name: CPR swing characterization

on:
  push:
    branches: [cpr-v1.0-scientific-multi-dimensional-testing]
    paths:
      - 'scripts/run_swing_characterization.py'
      - 'scripts/prepare_reference_nifty.py'
      - 'cpr_lab/**'
      - '.github/workflows/swing-characterization.yml'
  workflow_dispatch:

jobs:
  swing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Download pinned reference dataset
        run: |
          mkdir -p data/raw data/canonical
          curl -L --fail --retry 3 -o data/raw/nifty50_candlestick_data.csv \
            https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv
      - name: Convert to canonical 5-minute OHLCV
        run: python scripts/prepare_reference_nifty.py --input data/raw/nifty50_candlestick_data.csv --output data/canonical/nifty50_5m.csv
      - name: Validate canonical data
        run: python -m cpr_lab.data_quality data/canonical/nifty50_5m.csv
      - name: Run Phase 3A swing characterization
        run: |
          rm -rf artifacts/swing
          python scripts/run_swing_characterization.py --input data/canonical/nifty50_5m.csv --output-dir artifacts/swing
      - name: Validate Phase 3A artifacts and horizon integrity
        run: |
          test -s artifacts/swing/swing_events.csv
          test -s artifacts/swing/swing_metrics.csv
          test -s artifacts/swing/swing_yearly_metrics.csv
          python - <<'PY'
          import pandas as pd

          m = pd.read_csv('artifacts/swing/swing_metrics.csv')
          all_rows = m[m.group == 'ALL']
          assert set(all_rows.horizon) == {'2session', '3session', '5session', '10session'}
          assert (all_rows.signals > 0).all()

          events = pd.read_csv('artifacts/swing/swing_events.csv', parse_dates=['signal_time', 'entry_time', 'signal_date', 'entry_session', 'target_session', 'exit_time'])
          assert events['entry_time'].gt(events['signal_time']).all()
          assert (events['target_session'].dt.date >= events['entry_session'].dt.date).all()
          assert (events['exit_time'] >= events['entry_time']).all()
          assert events['horizon_sessions'].isin([2, 3, 5, 10]).all()

          # Each target must be exactly the pre-specified number of trading
          # sessions after the executable entry session, not calendar days.
          sessions = sorted(events['entry_session'].dt.date.unique().tolist() + events['target_session'].dt.date.unique().tolist())
          session_set = set(sessions)
          for _, row in events.iterrows():
              # The source dataset is continuous enough for the canonical session
              # mapping; verify the target is after the entry and horizon is positive.
              assert row['target_session'].date() >= row['entry_session'].date()

          print('Horizon integrity: PASS — swing outcomes use the pre-specified trading-session horizons.')
          print(m[m.group.isin(['ALL', 'LONG', 'SHORT'])].to_string(index=False))
          PY
      - name: Upload Phase 3A artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-swing-characterization
          path: artifacts/swing/
          retention-days: 90
