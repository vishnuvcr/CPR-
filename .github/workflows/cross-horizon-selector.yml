name: CPR cross-horizon selector

on:
  push:
    branches: [cpr-v1.0-scientific-multi-dimensional-testing]
    paths:
      - 'scripts/run_cross_horizon_selector.py'
      - 'scripts/run_swing_characterization.py'
      - 'scripts/prepare_reference_nifty.py'
      - 'cpr_lab/**'
      - 'docs/CPR_RESEARCH_PLAN.md'
      - '.github/workflows/cross-horizon-selector.yml'
  workflow_dispatch:

jobs:
  selector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Download pinned reference dataset
        run: |
          mkdir -p data/raw data/canonical artifacts/swing artifacts/cross-horizon
          curl -L --fail --retry 3 -o data/raw/nifty50_candlestick_data.csv \
            https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv
      - name: Convert to canonical 5-minute OHLCV
        run: python scripts/prepare_reference_nifty.py --input data/raw/nifty50_candlestick_data.csv --output data/canonical/nifty50_5m.csv
      - name: Validate canonical data
        run: python -m cpr_lab.data_quality data/canonical/nifty50_5m.csv
      - name: Recreate Phase 3A swing artifact
        run: python scripts/run_swing_characterization.py --input data/canonical/nifty50_5m.csv --output-dir artifacts/swing
      - name: Run Phase 4 selector
        run: python scripts/run_cross_horizon_selector.py --input artifacts/swing/swing_events.csv --output-dir artifacts/cross-horizon
      - name: Validate Phase 4 outputs and leakage guards
        run: |
          test -s artifacts/cross-horizon/cross_horizon_selections.csv
          test -s artifacts/cross-horizon/cross_horizon_selected_events.csv
          test -s artifacts/cross-horizon/cross_horizon_oos_comparison.csv
          test -s artifacts/cross-horizon/cross_horizon_oos_yearly.csv
          python - <<'PY'
          import pandas as pd
          s=pd.read_csv('artifacts/cross-horizon/cross_horizon_selections.csv', parse_dates=['train_end','purge_start','validation_start','validation_end'])
          o=pd.read_csv('artifacts/cross-horizon/cross_horizon_selected_events.csv', parse_dates=['entry_session','target_session'])
          c=pd.read_csv('artifacts/cross-horizon/cross_horizon_oos_comparison.csv')
          assert len(s)>=8 and set(s.side)=={'LONG','SHORT'}
          assert set(s.entry_bucket).issubset({'09:15-10:00','10:01-12:00','12:01-14:00','14:01+'})
          assert set(s.selected_horizon).issubset({'2session','3session','5session','10session'})
          assert len(o)>0
          assert set(c.strategy)=={'SELECTED','2session','3session','5session','10session'}
          assert (s.train_end < s.validation_start).all()
          assert (s.validation_end < s.validation_start.shift(-1)).dropna().all()
          assert (s.purge_start > s.train_end).all()
          assert (s.purge_start < s.validation_start).all()
          assert (o.entry_session <= o.target_session).all()
          print('Phase 4 validation: PASS')
          print(c.to_string(index=False))
          print(pd.read_csv('artifacts/cross-horizon/cross_horizon_oos_yearly.csv').to_string(index=False))
          PY
      - name: Upload Phase 4 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-cross-horizon-selector
          path: artifacts/cross-horizon/
          retention-days: 90
