name: CPR Phase 9C Consensus OOS Validation

on:
  workflow_dispatch:
  push:
    branches: [cpr-v1.0-scientific-multi-dimensional-testing]
    paths:
      - ".github/workflows/cpr-phase9c-consensus-oos.yml"
      - "scripts/run_phase9c_consensus_oos.py"
      - "scripts/run_phase9_shadow_engine.py"
      - "scripts/run_phase9b_consensus.py"
      - "scripts/run_cpr_regime_discovery.py"
      - "scripts/prepare_reference_nifty.py"
      - "scripts/prepare_phase7_independent_nifty.py"
      - "scripts/prepare_phase8_final_nifty.py"
      - "cpr_lab/**"
jobs:
  oos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m pip install "scikit-learn>=1.5" pyarrow
      - name: Download frozen discovery source
        run: |
          mkdir -p data/phase9c
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv" -o data/phase9c/reference.csv
      - name: Recreate and verify frozen frontier
        run: |
          python scripts/prepare_reference_nifty.py --input data/phase9c/reference.csv --output data/phase9c/reference_5m.csv
          rm -rf artifacts/frontier
          python scripts/run_cpr_regime_discovery.py --input data/phase9c/reference_5m.csv --output-dir artifacts/frontier
          test "$(sha256sum artifacts/frontier/regime_discovery_train_pareto.csv | cut -d' ' -f1)" = "601a72f5e64204aee7ff0bb77347d57b0e2b59871b8bc30011282c2dc02c28b2"
      - name: Download and prepare Phase 7 independent source
        run: |
          test "$(curl -sS --fail https://api.github.com/repos/ganeshbiyer/Nse_Historical_Data/git/trees/2a5ef9b3032a26a968b5595a452a77270188058e?recursive=1 | python -c 'import json,sys; print(next(x["sha"] for x in json.load(sys.stdin)["tree"] if x["path"]=="NIFTY50-INDEX.parquet"))')" = "c26c9babf4d7becc628f9fe23d71cd2e9e3c0db9"
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/ganeshbiyer/Nse_Historical_Data/af4d583e9bc0b5d7567b33bd5ec575cee5cbae3a/NIFTY50-INDEX.parquet" -o data/phase9c/p7.parquet
          python scripts/prepare_phase7_independent_nifty.py --input data/phase9c/p7.parquet --output data/phase9c/p7_5m.csv
      - name: Download and prepare Phase 8 untouched source
        run: |
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/ganeshbiyer/Nse_Historical_Data_2026/e8f19f3f53ca6fac0b116e83508e814e568dca54/NIFTY50-INDEX.parquet" -o data/phase9c/p8.parquet
          python scripts/prepare_phase8_final_nifty.py --input data/phase9c/p8.parquet --output data/phase9c/p8_5m.csv
      - name: Generate frozen shadow events with outcomes
        run: |
          python scripts/run_phase9_shadow_engine.py --input data/phase9c/p7_5m.csv --frontier artifacts/frontier/regime_discovery_train_pareto.csv --output-dir artifacts/p7 --attach-historical-outcomes
          python scripts/run_phase9_shadow_engine.py --input data/phase9c/p8_5m.csv --frontier artifacts/frontier/regime_discovery_train_pareto.csv --output-dir artifacts/p8 --attach-historical-outcomes
      - name: Validate fixed consensus taxonomy OOS
        run: |
          python scripts/run_phase9c_consensus_oos.py --p7 artifacts/p7/phase9_shadow_signals.csv --p8 artifacts/p8/phase9_shadow_signals.csv --output-dir artifacts/phase9c
      - name: Publish summary
        run: |
          {
            echo "## Phase 9C frozen consensus OOS validation"
            cat artifacts/phase9c/phase9c_provenance.csv
            echo
            cat artifacts/phase9c/phase9c_consensus_state_counts.csv
            echo
            python - <<'PY'
          import pandas as pd
          d=pd.read_csv("artifacts/phase9c/phase9c_consensus_oos_results.csv")
          print(d.to_string(index=False))
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-phase9c-consensus-oos
          path: |
            artifacts/phase9c/*.csv
            artifacts/p7/phase9_shadow_signals.csv
            artifacts/p8/phase9_shadow_signals.csv
