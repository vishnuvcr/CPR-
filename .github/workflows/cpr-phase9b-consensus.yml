name: CPR Phase 9B Consensus Analysis

on:
  workflow_dispatch:
  push:
    branches:
      - cpr-v1.0-scientific-multi-dimensional-testing
    paths:
      - ".github/workflows/cpr-phase9b-consensus.yml"
      - "scripts/run_phase9_shadow_engine.py"
      - "scripts/run_phase9b_consensus.py"
      - "scripts/run_cpr_regime_discovery.py"
      - "scripts/prepare_reference_nifty.py"
      - "cpr_lab/**"

jobs:
  consensus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m pip install "scikit-learn>=1.5"
      - name: Download frozen reference source
        run: |
          mkdir -p data/phase9b
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv" -o data/phase9b/reference.csv
      - name: Prepare reference data
        run: python scripts/prepare_reference_nifty.py --input data/phase9b/reference.csv --output data/phase9b/reference_5m.csv
      - name: Recreate and verify frozen frontier
        run: |
          rm -rf artifacts/frontier
          python scripts/run_cpr_regime_discovery.py --input data/phase9b/reference_5m.csv --output-dir artifacts/frontier
          test "$(sha256sum artifacts/frontier/regime_discovery_train_pareto.csv | cut -d' ' -f1)" = "601a72f5e64204aee7ff0bb77347d57b0e2b59871b8bc30011282c2dc02c28b2"
      - name: Generate shadow replay with historical outcomes
        run: |
          python scripts/run_phase9_shadow_engine.py             --input data/phase9b/reference_5m.csv             --frontier artifacts/frontier/regime_discovery_train_pareto.csv             --output-dir artifacts/phase9b             --attach-historical-outcomes
      - name: Run pre-registered consensus taxonomy
        run: |
          python scripts/run_phase9b_consensus.py             --signals artifacts/phase9b/phase9_shadow_signals.csv             --output-dir artifacts/phase9b
      - name: Publish summary
        run: |
          {
            echo "## Phase 9B CPR context consensus"
            cat artifacts/phase9b/phase9b_provenance.csv
            echo
            python - <<'PY'
          import pandas as pd
          d=pd.read_csv("artifacts/phase9b/phase9b_consensus_outcomes.csv")
          print(d.to_string(index=False))
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-phase9b-consensus
          path: artifacts/phase9b/*.csv
