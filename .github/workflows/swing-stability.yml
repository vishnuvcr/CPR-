name: CPR swing stability

on:
  push:
    branches: [cpr-v1.0-scientific-multi-dimensional-testing]
    paths:
      - 'scripts/run_swing_stability.py'
      - 'scripts/run_swing_characterization.py'
      - 'scripts/prepare_reference_nifty.py'
      - 'cpr_lab/**'
      - '.github/workflows/swing-stability.yml'
  workflow_dispatch:

jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Download pinned reference dataset
        run: |
          mkdir -p data/raw data/canonical artifacts/swing-stability
          curl -L --fail --retry 3 -o data/raw/nifty50_candlestick_data.csv \
            https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv
      - name: Convert to canonical 5-minute OHLCV
        run: python scripts/prepare_reference_nifty.py --input data/raw/nifty50_candlestick_data.csv --output data/canonical/nifty50_5m.csv
      - name: Validate canonical data
        run: python -m cpr_lab.data_quality data/canonical/nifty50_5m.csv
      - name: Recreate Phase 3A characterization artifact
        run: |
          rm -rf artifacts/swing
          python scripts/run_swing_characterization.py --input data/canonical/nifty50_5m.csv --output-dir artifacts/swing
      - name: Run Phase 3A stability diagnostics
        run: |
          python scripts/run_swing_stability.py --input artifacts/swing/swing_events.csv --output-dir artifacts/swing-stability
      - name: Validate stability outputs
        run: |
          test -s artifacts/swing-stability/swing_stability_direction.csv
          test -s artifacts/swing-stability/swing_stability_event_level.csv
          test -s artifacts/swing-stability/swing_stability_10session_blocks.csv
          test -s artifacts/swing-stability/swing_stability_subperiods.csv
          test -s artifacts/swing-stability/swing_stability_yearly.csv
          test -s artifacts/swing-stability/swing_stability_year_sign_consistency.csv
          python - <<'PY'
          import pandas as pd

          d = pd.read_csv('artifacts/swing-stability/swing_stability_direction.csv')
          assert len(d) == 8
          assert set(d.horizon) == {'2session', '3session', '5session', '10session'}
          assert set(d.side) == {'LONG', 'SHORT'}
          assert d.holm_p_value.between(0, 1).all()

          b = pd.read_csv('artifacts/swing-stability/swing_stability_10session_blocks.csv')
          assert len(b) == 8
          assert (b.n_units >= 2).all()

          s = pd.read_csv('artifacts/swing-stability/swing_stability_subperiods.csv')
          assert set(s.subperiod) == {'2015-2019', '2020-2024'}
          assert len(s) == 16

          print('Stability validation: PASS — eight pre-specified directional tests, fixed 10-session blocks, and two chronological subperiods are present.')
          print(d.to_string(index=False))
          print(b.to_string(index=False))
          print(s.to_string(index=False))
          PY
      - name: Upload Phase 3A stability artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-swing-stability
          path: artifacts/swing-stability/
          retention-days: 90
