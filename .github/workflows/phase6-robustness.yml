name: CPR Phase 6 robustness

on:
  push:
    branches: [cpr-v1.0-scientific-multi-dimensional-testing]
    paths:
      - 'scripts/run_phase6_robustness.py'
      - 'scripts/run_swing_characterization.py'
      - 'scripts/prepare_reference_nifty.py'
      - 'cpr_lab/**'
      - 'tests/test_phase6_robustness.py'
      - 'docs/CPR_RESEARCH_PLAN.md'
      - '.github/workflows/phase6-robustness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  robustness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run Phase 6 unit tests
        run: python -m pytest -q tests/test_phase6_robustness.py
      - name: Download pinned reference dataset
        run: |
          mkdir -p data/raw data/canonical artifacts/swing artifacts/phase6
          curl -L --fail --retry 3 -o data/raw/nifty50_candlestick_data.csv             https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv
      - name: Prepare canonical 5-minute data
        run: python scripts/prepare_reference_nifty.py --input data/raw/nifty50_candlestick_data.csv --output data/canonical/nifty50_5m.csv
      - name: Validate canonical data
        run: python -m cpr_lab.data_quality data/canonical/nifty50_5m.csv
      - name: Recreate swing events
        run: python scripts/run_swing_characterization.py --input data/canonical/nifty50_5m.csv --output-dir artifacts/swing
      - name: Run Phase 6 robustness
        run: |
          python scripts/run_phase6_robustness.py             --input data/canonical/nifty50_5m.csv             --swing-events artifacts/swing/swing_events.csv             --output-dir artifacts/phase6             --simulations 5000
      - name: Validate Phase 6 outputs
        run: |
          test -s artifacts/phase6/phase6_block_bootstrap.csv
          test -s artifacts/phase6/phase6_subperiod_stability.csv
          test -s artifacts/phase6/phase6_volatility_regimes.csv
          test -s artifacts/phase6/phase6_direction_robustness.csv
          test -s artifacts/phase6/phase6_threshold_perturbation.csv
          python - <<'PY'
          import pandas as pd
          p='artifacts/phase6/'
          base=pd.read_csv(p+'phase6_block_bootstrap.csv')
          sub=pd.read_csv(p+'phase6_subperiod_stability.csv')
          vol=pd.read_csv(p+'phase6_volatility_regimes.csv')
          direc=pd.read_csv(p+'phase6_direction_robustness.csv')
          pert=pd.read_csv(p+'phase6_threshold_perturbation.csv')
          assert set(base.horizon)=={'10session','2session','3session','5session'}
          assert set(sub.configuration)=={'2015-2019','2020-2024'}
          assert set(pert.configuration)=={'narrow=0.40,wide=0.80','narrow=0.50,wide=1.00','narrow=0.60,wide=1.20'}
          assert len(vol)>0 and len(direc)>0
          print('Phase 6 validation: PASS')
          for x in (base,sub,vol,direc,pert):
              print(x.to_string(index=False))
          PY
      - name: Publish Phase 6 results
        run: |
          mkdir -p research_outputs/phase6
          cp artifacts/phase6/*.csv research_outputs/phase6/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_outputs/phase6/
          if git diff --cached --quiet; then
            echo "No Phase 6 result changes to publish"
          else
            git commit -m "Publish Phase 6 robustness results [skip ci]"
            git push
          fi
      - name: Upload Phase 6 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-phase6-robustness
          path: artifacts/phase6/
          retention-days: 90
