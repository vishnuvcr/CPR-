name: CPR Phase 8 Final Untouched Forward Holdout
on:
  workflow_dispatch:
  push:
    branches: [cpr-v1.0-scientific-multi-dimensional-testing]
    paths:
      - ".github/workflows/cpr-phase8-final-untouched.yml"
      - "scripts/prepare_phase8_final_nifty.py"
      - "scripts/run_phase8_final_walkforward.py"
      - "scripts/run_cpr_regime_discovery.py"
      - "scripts/prepare_reference_nifty.py"
      - "cpr_lab/**"
jobs:
  phase8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          python -m pip install "scikit-learn>=1.5" pyarrow
      - name: Download frozen Phase 5A reference source
        run: |
          mkdir -p data/phase8
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv" -o data/phase8/reference.csv
      - name: Recreate and verify frozen frontier
        run: |
          python scripts/prepare_reference_nifty.py --input data/phase8/reference.csv --output data/phase8/reference_5m.csv
          rm -rf artifacts/phase8_frontier
          python scripts/run_cpr_regime_discovery.py --input data/phase8/reference_5m.csv --output-dir artifacts/phase8_frontier
          test "$(sha256sum artifacts/phase8_frontier/regime_discovery_train_pareto.csv | cut -d' ' -f1)" = "601a72f5e64204aee7ff0bb77347d57b0e2b59871b8bc30011282c2dc02c28b2"
      - name: Download untouched 2026 source
        run: |
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/ganeshbiyer/Nse_Historical_Data_2026/e8f19f3f53ca6fac0b116e83508e814e568dca54/NIFTY50-INDEX.parquet" -o data/phase8/NIFTY50-INDEX.parquet
      - name: Prepare untouched 5-minute data
        run: python scripts/prepare_phase8_final_nifty.py --input data/phase8/NIFTY50-INDEX.parquet --output data/phase8/final_5m.csv
      - name: Run frozen final forward evaluation
        run: python scripts/run_phase8_final_walkforward.py --input data/phase8/final_5m.csv --frontier artifacts/phase8_frontier/regime_discovery_train_pareto.csv --output-dir artifacts/phase8
      - name: Publish Phase 8 summary
        run: |
          {
            echo "## Phase 8 final untouched forward holdout"
            echo
            cat data/phase8/final_5m.provenance.txt
            echo
            python - <<'PY'
          import pandas as pd
          d = pd.read_csv("artifacts/phase8/phase8_cumulative_results.csv")
          print(f"Frozen candidates evaluated: {d.candidate_id.nunique()}")
          print()
          print(d.to_string(index=False))
          PY
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Phase 8 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-phase8-final-untouched
          path: |
            data/phase8/*.provenance.txt
            data/phase8/*.source_counts.csv
            artifacts/phase8_frontier/regime_discovery_train_pareto.csv
            artifacts/phase8/*.csv
