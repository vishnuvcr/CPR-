name: CPR Phase 4B selector stress

on:
  push:
    branches: [cpr-v1.0-scientific-multi-dimensional-testing]
    paths:
      - 'scripts/run_phase4b_selector_stress.py'
      - 'scripts/run_cross_horizon_selector.py'
      - 'scripts/run_swing_characterization.py'
      - 'scripts/prepare_reference_nifty.py'
      - 'cpr_lab/**'
      - 'docs/CPR_RESEARCH_PLAN.md'
      - '.github/workflows/phase4b-selector-stress.yml'
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -e '.[dev]'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run unit tests
        run: python -m pytest -q tests/test_phase4b_selector_stress.py
      - name: Download pinned reference dataset
        run: |
          mkdir -p data/raw data/canonical artifacts/swing artifacts/cross-horizon artifacts/phase4b
          curl -L --fail --retry 3 -o data/raw/nifty50_candlestick_data.csv \
            https://raw.githubusercontent.com/sandeepkapri/Nifty50-Minute-Data/81800ba10cf47e9c7806b6a40e300ef389187846/nifty50_candlestick_data.csv
      - name: Convert to canonical 5-minute OHLCV
        run: python scripts/prepare_reference_nifty.py --input data/raw/nifty50_candlestick_data.csv --output data/canonical/nifty50_5m.csv
      - name: Validate canonical data
        run: python -m cpr_lab.data_quality data/canonical/nifty50_5m.csv
      - name: Recreate Phase 3A swing artifact
        run: python scripts/run_swing_characterization.py --input data/canonical/nifty50_5m.csv --output-dir artifacts/swing
      - name: Recreate corrected Phase 4 selector artifact
        run: python scripts/run_cross_horizon_selector.py --input artifacts/swing/swing_events.csv --output-dir artifacts/cross-horizon
      - name: Run Phase 4B stress test
        run: |
          python scripts/run_phase4b_selector_stress.py \
            --selected artifacts/cross-horizon/cross_horizon_selected_events.csv \
            --events artifacts/swing/swing_events.csv \
            --selections artifacts/cross-horizon/cross_horizon_selections.csv \
            --output-dir artifacts/phase4b \
            --simulations 5000
      - name: Validate Phase 4B outputs
        run: |
          test -s artifacts/phase4b/phase4b_random_horizon_null.csv
          test -s artifacts/phase4b/phase4b_null_distribution.csv
          test -s artifacts/phase4b/phase4b_paired_bootstrap.csv
          test -s artifacts/phase4b/phase4b_selection_concentration.csv
          python - <<'PY'
          import pandas as pd
          n=pd.read_csv('artifacts/phase4b/phase4b_random_horizon_null.csv')
          d=pd.read_csv('artifacts/phase4b/phase4b_null_distribution.csv')
          p=pd.read_csv('artifacts/phase4b/phase4b_paired_bootstrap.csv')
          c=pd.read_csv('artifacts/phase4b/phase4b_selection_concentration.csv')
          assert len(n)==1 and len(d)==5000
          assert set(p.comparison)=={'SELECTED_vs_2session','SELECTED_vs_3session','SELECTED_vs_5session','SELECTED_vs_10session'}
          assert set(c.selected_horizon)=={'2session','3session','5session','10session'}
          assert abs(c.fraction.sum()-1.0)<1e-12
          assert n.actual_selected_mean_R.notna().all()
          assert n.null_mean_R.notna().all()
          assert n.empirical_two_sided_p.between(0,1).all()
          assert p.block_bootstrap_ci95_low.notna().all()
          assert p.block_bootstrap_ci95_high.notna().all()
          print('Phase 4B validation: PASS — reproducible null, paired bootstrap, and concentration outputs present')
          print(n.to_string(index=False))
          print(p.to_string(index=False))
          print(c.to_string(index=False))
          PY
      - name: Upload Phase 4B artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cpr-phase4b-selector-stress
          path: artifacts/phase4b/
          retention-days: 90
