[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpr-scientific-lab"
version = "1.0.0"
description = "Scientific multi-dimensional CPR research and backtesting framework"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "pyyaml>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
research = ["pandas-ta>=0.3.14b0", "scikit-learn>=1.5"]

[tool.setuptools.packages.find]
include = ["cpr_lab", "cpr_lab.*"]
exclude = ["tests", "results", "configs", "docs"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
